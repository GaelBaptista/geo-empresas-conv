[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cron também definido no export config da function (*/5 * * * * UTC).
# Blob do site (entrevista-freeze) NÃO reseta em deploy.

# Secrets Minivagas — SOMENTE no painel Netlify (nunca no Git):
#   MINIVAGAS_TOKEN = token da API  (Functions: proxy + freeze)
# NÃO use VITE_PUBLIC_TOKEN em produção (vai para o JS do browser).
# Depois: Deploys → Clear cache and deploy site

# Front chama /api/minivagas; Function aplica o Bearer no servidor.
[[redirects]]
  from = "/api/minivagas"
  to = "/.netlify/functions/minivagas-proxy"
  status = 200
  force = true
