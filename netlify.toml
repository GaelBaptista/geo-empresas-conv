[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cron também definido no export config da function (*/5 * * * * UTC).
# Blob do site (entrevista-freeze) NÃO reseta em deploy.

# Token Minivagas:
# - Preferir MINIVAGAS_TOKEN no painel Netlify (Functions).
# - Fallback server-only em netlify/functions (NÃO vai pro JS do browser).
# - NÃO use VITE_PUBLIC_TOKEN no build do front (embaixa no bundle).

# Opcional: mesmo path curto redireciona para a Function
[[redirects]]
  from = "/api/minivagas"
  to = "/.netlify/functions/minivagas-proxy"
  status = 200
  force = true
