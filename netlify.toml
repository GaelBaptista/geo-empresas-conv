[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cron também definido no export config da function (*/5 * * * * UTC).
# Blob do site (entrevista-freeze) NÃO reseta em deploy.

# Secrets Minivagas — SOMAENTE no painel Netlify (nunca no Git / .env.production):
#   MINIVAGAS_TOKEN = token da API  (Functions: minivagas-proxy + entrevista-freeze)
# NÃO defina VITE_PUBLIC_TOKEN em produção — o prefixo VITE_ embute no JS do browser.
# Depois: Deploys → Trigger deploy → Clear cache and deploy site
